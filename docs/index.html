<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="https://www.perfectcorp.com/favicon.png" sizes="32x32">
<title>PERFECT · App Metrics Dashboard</title>
<style>
:root{ color-scheme: light;
  --bg:#f5f6f8; --card:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
  --brand:#e11d74; --blue:#2563eb; --pink:#db2777; --green:#059669; --red:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
.app{display:flex;min-height:100vh}
.side{width:212px;flex:none;background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{padding:4px 8px 18px}
.brand img{height:28px;width:auto;display:block}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#374151;text-decoration:none;font-weight:600;font-size:13.5px;cursor:pointer;margin-bottom:4px}
.nav a:hover{background:#f3f4f6}
.nav a.on{background:#fde7f1;color:var(--brand)}
.nav .ic{width:16px;height:16px;flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid var(--line);background:#fff}
.topbar .ttl{font-size:18px;font-weight:700}
.topbar .spacer{flex:1}
.datepick{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:#fff}
.datepick label{color:var(--muted);font-size:12px;font-weight:600}
.datepick input{border:0;font:inherit;color:var(--ink);outline:none}
.content{padding:20px 24px 48px;max-width:1920px;width:100%}
.controls{margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{appearance:none;border:0;background:#fff;color:var(--muted);padding:7px 16px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.seg button:disabled{color:#cbd1d9;cursor:not-allowed}
.row2{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-top:10px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl .cl{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.pill{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pill button{appearance:none;border:0;background:#fff;color:#4b5563;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.pill button.on{background:#eef2ff;color:var(--blue)}
.cmp{color:var(--muted);font-size:12px;margin:14px 0 16px}
/* shared delta colours (used by the report tiles) */
.up{color:var(--green)} .down{color:var(--red)}
/* summary-report header */
.rephead{display:flex;align-items:flex-end;gap:14px;border-left:3px solid var(--brand);padding:2px 0 2px 12px;margin-bottom:12px}
.rephead .kick{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.rephead .h{font-size:18px;font-weight:700}
.rephead .h b{color:var(--blue)}
.btn{appearance:none;border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:9px;padding:8px 14px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
/* ===== ported original report styling (scoped) ===== */
.report .grid{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
.report .tile{flex:1;min-width:192px;background:#fff;border:1px solid #e7ebf0;border-radius:12px;padding:16px 18px;box-shadow:0 1px 2px rgba(20,30,50,.05);text-align:center;}
.report .tile .k{font-size:12px;color:#6b7480;font-weight:600;}
.report .tile .v{font-size:26px;font-weight:700;margin:4px 0 6px;}
.report .chg{font-size:12.5px;font-weight:700;white-space:nowrap;}
.report .up{color:#2d7d46;} .report .down{color:#c0392b;} .report .flat{color:#6b7480;}
.report .deltas{display:flex;gap:14px;justify-content:center;}
.report .d{display:flex;flex-direction:column;gap:1px;align-items:center;}
.report .dl{font-size:9.5px;font-weight:700;color:#9aa3ad;letter-spacing:.05em;}
/* Install-by-source strip: laid out on the same flex row as the KPI tiles, with one
   invisible spacer per tile (and conversion connector) that precedes App Total Install,
   so the block's left edge lines up with that tile. A stub + top border draw the link. */
.report .srcrow{display:flex;margin:8px 0 6px;}
.report .srcwrap{position:relative;background:#fff;border:1px solid #e7ebf0;border-top:2px solid #2563eb;border-radius:12px;padding:11px 14px 12px;box-shadow:0 1px 2px rgba(20,30,50,.05);}
.report .srcwrap::before{content:"";position:absolute;top:-10px;left:26px;width:2px;height:10px;background:#2563eb;}
.report .srccap{font-size:10.5px;font-weight:700;color:#2563eb;letter-spacing:.05em;text-transform:uppercase;margin-bottom:9px;}
.report .srcstrip{display:flex;gap:10px;flex-wrap:wrap;}
.report .scell{flex:1;min-width:158px;background:#f8fafc;border:1px solid #eef1f4;border-radius:9px;padding:8px 11px;display:flex;flex-direction:column;gap:2px;text-align:left;}
.report .scell .sk{font-size:11px;font-weight:700;color:#6b7480;}
.report .scell .sv{font-size:19px;font-weight:700;line-height:1.15;}
.report .scell .ss{font-size:11px;color:#8a929c;margin-bottom:3px;}
.report .scell .deltas{gap:9px;justify-content:flex-start;}
.report .scell .d{align-items:flex-start;}
.report .scell .chg{font-size:11.5px;white-space:nowrap;}
.report .scell .dl{font-size:9px;}
.report .sbar{display:flex;height:13px;border-radius:7px;overflow:hidden;margin:2px 0 8px;background:#f0f3f7;}
.report .sbar span{display:block;height:13px;}
.report .sleg{display:flex;gap:16px;font-size:11.5px;color:#6b7480;flex-wrap:wrap;margin-bottom:12px;}
.report .sleg i,.report .sdot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;}
/* funnel conversion connector between two KPI tiles */
.report .conv{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:128px;padding:10px 6px;}
.report .conv .carrow{color:#c4ccd6;font-size:16px;line-height:1;margin-bottom:1px;}
.report .conv .ck{font-size:9.5px;color:#6b7480;font-weight:700;text-transform:uppercase;letter-spacing:.03em;text-align:center;line-height:1.2;}
.report .conv .cv{font-size:21px;font-weight:700;color:#2563eb;margin:1px 0 2px;}
.report .conv .deltas{gap:8px;}
.report .conv .dl{text-align:center;}
.report .card{background:#fff;border:1px solid #e7ebf0;border-radius:12px;padding:18px 20px;margin:14px 0;box-shadow:0 1px 2px rgba(20,30,50,.05);}
.report .card h2{font-size:14px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.04em;color:#39424f;}
.report .ins{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:13px;line-height:1.45;}
.report .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 auto;}
.report .ins b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:#9aa3ad;margin-bottom:1px;}
.report .ins .head{display:block;font-weight:700;font-size:14px;margin-bottom:2px;}
.report .ins .detail{display:block;color:#5b6470;font-size:12.5px;}
.report table{border-collapse:collapse;width:100%;font-size:13px;}
.report th,.report td{padding:9px 11px;text-align:right;border-bottom:1px solid #eef1f4;white-space:nowrap;}
.report th:first-child,.report td:first-child{text-align:left;}
.report thead th{background:#f7f9fb;font-weight:600;color:#39424f;}
.report th.an,.report td.an{background:#eef3ff;font-weight:700;}
.report tr.convrow td{background:#f7faff;}
.report tr.convrow td.an{background:#e6efff;}
.report tr.convrow td:first-child{color:#2563eb;font-weight:600;}
.report .fn{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px;}
.report .fn .name{width:150px;color:#39424f;}
.report .fn .track{position:relative;flex:1;height:16px;background:#f0f3f7;border-radius:8px;}
.report .fn .bar{position:absolute;top:0;height:16px;border-radius:8px;}
.report .fn .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#c4ccd6;}
.report .fn .val{width:66px;text-align:right;font-weight:600;}
.report .fn.div .name{font-weight:700;}
.report .sub{color:#6b7480;font-size:12.5px;}
.report ul.gaps{margin:4px 0;padding-left:18px;font-size:12px;color:#6b7480;}
.foot{color:var(--muted);font-size:11.5px;margin-top:18px}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:14px;margin:14px 0}
.load{color:var(--muted);padding:40px 0;text-align:center}
/* Narrow effective viewport (boss screen: 150% DPI + Chrome zoom 110-125% collapses
   the CSS viewport to ~1024-1164px). Tighten the report KPI row so all 4 tiles +
   the conversion connector stay on one line and Revenue is not pushed below. */
@media(max-width:1200px){
  .report .grid{gap:8px;}
  .report .tile{min-width:120px;padding:12px 8px;}
  .report .tile .v{font-size:20px;margin:3px 0 5px;}
  .report .deltas{gap:6px;}
  .report .chg{font-size:11px;}
  .report .dl{font-size:9px;}
  .report .conv{min-width:84px;padding:8px 4px;}
  .report .conv .carrow{font-size:14px;}
  .report .conv .cv{font-size:17px;}
  .report .conv .ck{font-size:9px;}
  .report .conv .deltas{gap:4px;}
}
@media(max-width:820px){.side{display:none}
  /* no room to hang off a tile on a phone: drop the spacers and run full width */
  .report .srcwrap{margin-left:0 !important}}
@media print{.side,.topbar .datepick,.controls,.btn{display:none!important}.topbar{border:0}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="https://d3ss46vukfdtpo.cloudfront.net/static/media/PERFECT_logo_newcolor.ff00d06d.svg" alt="PERFECT"></div>
    <nav class="nav" id="nav">
      <!-- Live Dashboard removed 2026-09-01 (chart page retired). The nav is kept so
           further pages / split-out views can be added back here. -->
      <a data-page="report" class="on">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
        Summary Report
      </a>
    </nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="ttl" id="ttl">Summary Report</div>
      <div class="spacer"></div>
      <div class="datepick"><label for="dp">Date</label><input type="date" id="dp"></div>
    </div>
    <div class="content">
      <div class="controls" id="controls" style="display:none">
        <div class="seg" id="modeSeg">
          <button data-m="daily">Daily</button>
          <button data-m="weekly">Weekly</button>
        </div>
        <div class="row2">
          <div class="ctl"><span class="cl">App</span><div class="pill" id="appPill"></div></div>
          <div class="ctl"><span class="cl">Country</span><div class="pill" id="ctyPill"></div></div>
          <div class="ctl" id="osCtl" style="display:none"><span class="cl">OS</span><div class="pill" id="osPill"></div></div>
        </div>
        <div class="cmp" id="cmp"></div>
      </div>
      <div id="body"><div class="load">Loading latest data…</div></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>
</div>

<script>
let INDEX=null, CACHE={};
/* Only the Summary Report page remains (the Live Dashboard was retired 2026-09-01).
   S.page is kept so a second page can be re-introduced without reworking the nav. */
const S={page:"report",date:null,mode:"daily",app:"all_app",cty:"all",os:"ios"};
try{ const sv=localStorage.getItem("pf_page"); if(sv&&sv!=="live") S.page=sv; }catch(e){}

/* shared helpers */
function last(a){ return a[a.length-1]; }
function fmt(n){ return (n==null)?"n/a":Math.round(n).toLocaleString("en-US"); }
function pctTxt(x){ return (x==null)?"n/a":((x>=0?"+":"")+(x*100).toFixed(1)+"%"); }
function cl(x){ return (x==null)?"flat":(x>0?"up":(x<0?"down":"flat")); }
function cls(x){ return x>=0?"up":"down"; }
function pct(x){ return (x>=0?"+":"")+(x*100).toFixed(1)+"%"; }
function median(a){const s=a.filter(v=>v!=null).slice().sort((p,q)=>p-q);if(!s.length)return null;const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function appName(D,key){ const a=D.apps.find(x=>x[0]===key); return a?a[1]:key; }
function ctyName(D,key){ const c=D.countries.find(x=>x[0]===key); return c?c[1]:key; }
/* OS axis (added 2026-08). Reports built before the OS split have a 2-level
   cube[app][cty] and no D.oses. The all_os aggregate was later removed (Android
   install lags ~14d, so an iOS+Android total misreads the funnel) — the axis is now
   iOS (the default/anchor) + Android. Legacy reports may still carry an all_os layer;
   osKeys()/sliceOf() keep the page working across all three shapes. */
function hasOS(D){ return Array.isArray(D.oses) && D.oses.length>0; }
function osName(D,key){ const o=(D.oses||[]).find(x=>x[0]===key); return o?o[1]:key; }
/* Never surface the legacy all_os aggregate in the switcher. */
function osKeys(D){ return (D.oses||[]).filter(o=>o[0]!=="all_os"); }
function sliceOf(D,app,cty){
  const c=((D.cube||{})[app]||{})[cty];
  if(!c) return null;
  if(!hasOS(D)) return c;                        // legacy 2-level cube
  return c[S.os] || c.ios || c.all_os || c[Object.keys(c)[0]] || null;  // OS layer
}
function weekRange(D){ const t=(D.date_cols||[]).find(c=>/^This/.test(c)); return t? t.replace(/^This\s*/,"").replace(/(\d\d-\d\d)-(\d\d-\d\d)/,"$1 – $2") : ""; }

async function getReport(date){
  if(CACHE[date]) return CACHE[date];
  const r=await fetch("./data/report_"+date+".json",{cache:"no-store"});
  if(!r.ok) throw new Error("No report file for "+date+" (HTTP "+r.status+")");
  CACHE[date]=await r.json(); return CACHE[date];
}
function resolveWeekly(date){ for(const d of (INDEX.weekly_dates||[])){ if(d<=date) return d; } return null; }

/* ---------- control bar ---------- */
function syncControls(D,dailyAvail,weeklyAvail){
  document.getElementById("controls").style.display="block";
  document.querySelectorAll("#modeSeg button").forEach(b=>{
    const ok=b.dataset.m==="daily"?dailyAvail:weeklyAvail;
    b.disabled=!ok; b.classList.toggle("on",b.dataset.m===S.mode);
  });
  document.getElementById("appPill").innerHTML=D.apps.map(a=>`<button data-a="${a[0]}" class="${a[0]===S.app?'on':''}">${a[1]}</button>`).join("");
  document.getElementById("ctyPill").innerHTML=D.countries.map(c=>`<button data-c="${c[0]}" class="${c[0]===S.cty?'on':''}">${c[1]}</button>`).join("");
  const osCtl=document.getElementById("osCtl");
  const osList=osKeys(D);
  if(osList.length){
    osCtl.style.display="";
    const avail=o=>!!(((D.cube[S.app]||{})[S.cty]||{})[o]);
    document.getElementById("osPill").innerHTML=osList.map(o=>
      `<button data-o="${o[0]}" class="${o[0]===S.os?'on':''}" ${avail(o[0])?'':'disabled style="opacity:.4;cursor:not-allowed"'}>${o[1]}</button>`).join("");
  } else { osCtl.style.display="none"; }
  document.getElementById("cmp").textContent=(S.mode==="weekly"
     ? "Comparison: this week vs last week (WoW) + vs prior-4-week avg (Wo4W)"
     : "Comparison: analysis day vs previous day (DoD) + same weekday last week (WoW) + past-4-week avg (Wo4W)");
}

/* ---------- dispatch ---------- */
async function refresh(){
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.page===S.page));
  const dailyAvail=(INDEX.daily_dates||[]).includes(S.date);
  const wkSrc=resolveWeekly(S.date), weeklyAvail=!!wkSrc;
  if(S.mode==="daily" && !dailyAvail && weeklyAvail) S.mode="weekly";
  if(S.mode==="weekly" && !weeklyAvail && dailyAvail) S.mode="daily";

  let block,srcDate;
  try{
    if(S.mode==="daily"){ const rep=await getReport(S.date); block=rep.daily; srcDate=S.date; if(!block) throw new Error("No daily report for "+S.date); }
    else { const rep=await getReport(wkSrc); block=rep.weekly; srcDate=wkSrc; if(!block) throw new Error("No weekly report on/before "+S.date); }
  }catch(e){
    document.getElementById("controls").style.display="none";
    document.getElementById("body").innerHTML='<div class="err"><b>No report available.</b><br>'+(e.message||e)+
      '<br><br>Available daily: '+(INDEX.daily_dates||[]).join(", ")+'<br>Available weekly: '+(INDEX.weekly_dates||[]).join(", ")+'</div>';
    return;
  }
  const D=block.data;
  if(!D.apps.some(a=>a[0]===S.app)) S.app="all_app";
  if(!D.countries.some(c=>c[0]===S.cty)) S.cty=D.countries[0][0];
  // Keep the OS selection valid for the current app/country. Prefer iOS (the anchor);
  // otherwise the first available OS. all_os is never selected (removed).
  if(hasOS(D) && !(((D.cube[S.app]||{})[S.cty]||{})[S.os])){
    const av=osKeys(D).map(o=>o[0]).filter(o=>((D.cube[S.app]||{})[S.cty]||{})[o]);
    S.os = av.includes("ios") ? "ios" : (av[0] || "ios");
  }
  syncControls(D,dailyAvail,weeklyAvail);
  renderReport(block,srcDate);
  document.getElementById("foot").textContent="Source: data-auto-analyzer / metric-analysis · reads the latest JSON committed in /docs/data."+
    (S.mode==="weekly" && srcDate!==S.date ? "  ·  Weekly source: "+srcDate+" (most recent Monday report ≤ selected date)" : "");
}

/* ---------- Summary Report (faithful reproduction of the daily/weekly report) ---------- */
function card(title,inner){ return `<div class="card"><h2>${title}</h2>${inner}</div>`; }
function deltaChip(label,x){
  if(x==null) return `<span class="d"><span class="dl">${label}</span><span class="chg flat">n/a</span></span>`;
  const arr=x>0?"▲":(x<0?"▼":"■");
  return `<span class="d"><span class="dl">${label}</span><span class="chg ${cl(x)}">${arr} ${pctTxt(x)}</span></span>`;
}
/* Signal colours (item 4): green = positive, orange = caution, red = warning,
   slate = neutral/informational. Keyed off each insight's `tone` from the backend. */
const TONE={good:{dot:"#059669",head:"#047857"},warn:{dot:"#e67e22",head:"#b45309"},
            alert:{dot:"#dc2626",head:"#b91c1c"},info:{dot:"#64748b",head:"#334155"}};
const TONE_RANK={alert:0,warn:1,good:2,info:3};
function toneOf(o){ return TONE[o.tone]||TONE.info; }
/* Per-slice executive summary: prefer DATA.insights[app][cty], fall back to the
   app's All-country set, then to the legacy global MD bullets. */
function insList(D,block){
  // insights are keyed [app][cty] (legacy) or [app][cty][os] (OS-aware). pick(x)
  // returns the list, descending into the OS layer when present.
  const pick=x=>!x?null:(hasOS(D)?(x[S.os]||x.ios||x.all_os||null):x);
  const bag=(D.insights||{})[S.app];
  if(bag){ const v=pick(bag[S.cty]); if(v) return v; const va=pick(bag.all); if(va) return va; }
  return (block.insights||[]).map(o=>{
    const i=(o.title||"").indexOf(" — ");
    return {kick:i>=0?o.title.slice(0,i):(o.title||""),
            head:i>=0?o.title.slice(i+3):"", body:o.body, tone:"info"};
  });
}
function execHtml(list){
  list=(list||[]).slice().sort((a,b)=>(TONE_RANK[a.tone]??3)-(TONE_RANK[b.tone]??3));
  const rows=list.map(o=>{
    const c=toneOf(o);
    const head=o.head?`<span class="head" style="color:${c.head}">${o.head}</span>`:"";
    return `<div class="ins"><span class="dot" style="background:${c.dot}"></span><span><b>${o.kick}</b>${head}<span class="detail">${o.body}</span></span></div>`;
  }).join("");
  return card("Executive Summary",rows);
}
/* Funnel conversion rate = down / up (e.g. New Subs / Install), with WoW & Wo4W
   as percentage-point deltas. Computed from the cube's per-date values so it tracks
   the switcher. A 0/missing denominator (an omitted row) yields n/a, not a bogus rate. */
function convCells(D,s,upKey,downKey){
  const u=s[upKey], d=s[downKey];
  if(!u||!d||!u.vals||!d.vals) return null;
  const ai=u.vals.length-1;
  const rate=(dv,uv)=>(uv==null||uv===0||dv==null)?null:(dv/uv);
  const now=rate(last(d.vals),last(u.vals));
  const wi=(D.mode=="daily")?ai-1:0;                 // one period before (WoW baseline)
  const wowBase=(wi>=0)?rate(d.vals[wi],u.vals[wi]):null;
  // DoD (daily only): conversion on the previous calendar day, from each metric's
  // prev-day value (pv), computed server-side since vals[] are same-weekday baselines.
  const dodBase=(D.mode=="daily")?rate(d.pv,u.pv):null;
  let w4Base=null;
  if(D.mode=="daily"){                                // mean of the baseline weeks' ratios
    const rs=[]; for(let k=0;k<ai;k++){const r=rate(d.vals[k],u.vals[k]); if(r!=null) rs.push(r);}
    if(rs.length) w4Base=rs.reduce((a,b)=>a+b,0)/rs.length;
  } else { w4Base=rate(d.mean,u.mean); }
  // DoD / WoW / Wo4W as relative % change (same unit as the KPI tiles), not pp.
  return {now, base:w4Base,
               dod:(now!=null&&dodBase)?(now-dodBase)/dodBase:null,
               wow:(now!=null&&wowBase)?(now-wowBase)/wowBase:null,
               wo4w:(now!=null&&w4Base)?(now-w4Base)/w4Base:null};
}
function convRate(dv,uv){ return (uv==null||uv===0||dv==null)?null:dv/uv; }
function convConnector(D,s,upKey,downKey){
  const c=convCells(D,s,upKey,downKey);
  const rateTxt=(c&&c.now!=null)?(c.now*100).toFixed(1)+"%":"n/a";
  const shrt=k=>D.metric_labels[k].replace("App Total ","");
  const dodChip=(D.mode=="daily")?deltaChip("DoD",c?c.dod:null):"";
  return `<div class="conv"><div class="carrow">▸</div><div class="ck">${shrt(upKey)} → ${shrt(downKey)}<br>conversion</div><div class="cv">${rateTxt}</div><div class="deltas">${dodChip}${deltaChip("WoW",c?c.wow:null)}${deltaChip("Wo4W",c?c.wo4w:null)}</div></div>`;
}
/* Insert a conversion connector after these upstream tiles (up → next count layer). */
const CONV_AFTER={app_total_install:"app_total_new_subs"};
function kpiHtml(s,D){
  const parts=[];
  D.metric_order.forEach(m=>{
    const n=s[m], v=n?last(n.vals):null;
    const dodChip=(D.mode=="daily")?deltaChip("DoD",n?n.dod:null):"";
    parts.push(`<div class="tile" data-m="${m}"><div class="k">${D.metric_labels[m]}</div><div class="v">${fmt(v)}</div><div class="deltas">${dodChip}${deltaChip("WoW",n?n.wow:null)}${deltaChip("Wo4W",n?n.wo4w:null)}</div></div>`);
    const dn=CONV_AFTER[m];
    if(dn && D.metric_order.includes(dn)) parts.push(convConnector(D,s,m,dn));
  });
  return '<div class="grid">'+parts.join("")+'</div>';
}
/* ---------- Install by source ---------- */
const SRC_COLORS=["#059669","#2563eb","#e67e22","#8e44ad"];
/* The block hangs off the parent KPI tile. Rather than trying to reproduce the KPI
   row's flex maths (tiles grow, the conversion connector is content-sized), we render
   the wrap full width and then measure: shift it right by the parent tile's own offset
   inside the row. Exact at any width, and re-run on resize. Below a usable width the
   offset is dropped and the block runs full width instead. */
const SRC_MIN_W=470;
function alignSrc(){
  const row=document.querySelector(".report .srcrow"), wrap=row&&row.querySelector(".srcwrap");
  const grid=document.querySelector(".report .grid");
  if(!row||!wrap||!grid) return;
  const pk=wrap.dataset.parent, tile=pk?grid.querySelector('.tile[data-m="'+pk+'"]'):null;
  const rowW=grid.getBoundingClientRect().width;
  let off=tile?(tile.getBoundingClientRect().left-grid.getBoundingClientRect().left):0;
  if(!tile||off<0||rowW-off<SRC_MIN_W) off=0;
  wrap.style.marginLeft=off.toFixed(1)+"px";
}
window.addEventListener("resize",alignSrc);
function srcStripHtml(s,D){
  const so=D.source_order||[], pk=D.source_parent;
  if(!so.length||!pk) return "";
  const parent=s[pk], ptot=parent?last(parent.vals):null, daily=D.mode=="daily";
  const cur=m=>s[m]?last(s[m].vals):null;
  const shr=v=>(v==null||ptot==null||!ptot)?"n/a":((v/ptot*100).toFixed(1)+"% of Install");
  const plabel=D.metric_labels[pk]||"Install";
  const cells=so.map((m,i)=>{
    const n=s[m], v=cur(m);
    const dodChip=daily?deltaChip("DoD",n?n.dod:null):"";
    return `<div class="scell" style="border-left:3px solid ${SRC_COLORS[i%4]}">`
      +`<span class="sk">${D.source_labels[m]}</span><span class="sv">${fmt(v)}</span>`
      +`<span class="ss">${shr(v)}</span>`
      +`<div class="deltas">${dodChip}${deltaChip("WoW",n?n.wow:null)}${deltaChip("Wo4W",n?n.wo4w:null)}</div></div>`;
  }).join("");
  return '<div class="srcrow">'
    +'<div class="srcwrap" style="flex:1 1 auto" data-parent="'+pk+'">'
    +'<div class="srccap">&#9492; '+plabel+' &mdash; by source &middot; '+appName(D,S.app)+' &middot; '+ctyName(D,S.cty)
    +(hasOS(D)?' &middot; '+osName(D,S.os):'')+'</div>'
    +'<div class="srcstrip">'+cells+'</div></div></div>';
}
function srcCardHtml(s,D){
  const so=D.source_order||[], pk=D.source_parent;
  if(!so.length||!pk) return "";
  const parent=s[pk], ptot=parent?last(parent.vals):null, daily=D.mode=="daily";
  const cur=m=>s[m]?last(s[m].vals):null;
  const shrS=v=>(v==null||ptot==null||!ptot)?"n/a":((v/ptot*100).toFixed(1)+"%");
  const plabel=D.metric_labels[pk]||"Install";
  const dcell=x=>`<td><span class="chg ${cl(x)}">${pctTxt(x)}</span></td>`;
  const head="<tr><th>Source</th><th>Value</th><th>Share of Install</th>"
    +(daily?"<th>DoD &Delta;%</th>":"")+"<th>WoW &Delta;%</th><th>Wo4W &Delta;%</th></tr>";
  const rows=so.map((m,i)=>{
    const n=s[m], v=cur(m);
    return `<tr><td><i class="sdot" style="background:${SRC_COLORS[i%4]}"></i>${D.source_labels[m]}</td>`
      +`<td>${fmt(v)}</td><td>${shrS(v)}</td>`+(daily?dcell(n?n.dod:null):"")
      +dcell(n?n.wow:null)+dcell(n?n.wo4w:null)+"</tr>";
  }).join("");
  const totRow=`<tr><td><b>${plabel} (total)</b></td><td><b>${fmt(ptot)}</b></td><td>100%</td>`
    +(daily?dcell(parent?parent.dod:null):"")+dcell(parent?parent.wow:null)
    +dcell(parent?parent.wo4w:null)+"</tr>";
  const segs=so.map((m,i)=>{const v=cur(m); const w=(v==null||!ptot)?0:(v/ptot*100);
    return `<span style="width:${w.toFixed(1)}%;background:${SRC_COLORS[i%4]}" title="${D.source_labels[m]}"></span>`;}).join("");
  const leg=so.map((m,i)=>{const v=cur(m);
    return `<span><i style="background:${SRC_COLORS[i%4]}"></i>${D.source_labels[m]} ${(v==null||!ptot)?"":((v/ptot*100).toFixed(1)+"%")}</span>`;}).join("");
  return card(plabel+" by source &middot; "+appName(D,S.app)+" &middot; "+ctyName(D,S.cty)+(hasOS(D)?" &middot; "+osName(D,S.os):""),
    `<div class="sbar">${segs}</div><div class="sleg">${leg}</div>`
    +`<table><thead>${head}</thead><tbody>${rows}${totRow}</tbody></table>`
    +`<p class="sub" style="margin:9px 0 0">Shares are % of the ${plabel} total. Only the three tracked sources are broken out, so they need not sum to 100%.</p>`);
}
function funnelHtml(s,D){
  const lagged=new Set(D.lagged||[]);
  const pts=D.metric_order.map(m=>[m, s[m]?s[m].p:null]);
  const have=pts.map(x=>x[1]).filter(v=>v!=null);
  const title="Funnel — same-period change by layer · "+appName(D,S.app)+" · "+ctyName(D,S.cty);
  if(!have.length) return card(title,'<p class="sub" style="margin:0">No data for this slice.</p>');
  const acq=pts.filter(([m,p])=>p!=null && !lagged.has(m)).map(x=>x[1]);
  const cons=median(acq.length?acq:have), dth=D.divergence_threshold, scale=Math.max(...have.map(Math.abs),0.05);
  let html=`<div class="sub" style="margin:-4px 0 10px">Acquisition consensus ${pctTxt(cons)} · orange outline = conversion diverges &gt; ${(dth*100).toFixed(0)}pp · lagged metric greyed</div>`;
  html+=pts.map(([m,p])=>{
    const labx=D.metric_labels[m]+(lagged.has(m)?" · lagged ~7d":"");
    if(p==null) return `<div class="fn"><span class="name">${labx}</span><span class="track"><span class="mid"></span></span><span class="val flat">n/a</span></div>`;
    const isLag=lagged.has(m), dv=!isLag && Math.abs(p-cons)>dth, half=Math.abs(p)/scale*50;
    const col=isLag?"#9aa3ad":(p>=0?"#2d7d46":"#c0392b");
    const st=(p>=0)?`left:50%;width:${half.toFixed(1)}%;background:${col};`:`left:${(50-half).toFixed(1)}%;width:${half.toFixed(1)}%;background:${col};`;
    return `<div class="fn${dv?' div':''}"><span class="name"${isLag?' style="color:#9aa3ad"':''}>${labx}</span><span class="track"><span class="mid"></span><span class="bar" style="${st}${dv?'outline:2px solid #e67e22;':''}"></span></span><span class="val ${isLag?'flat':cl(p)}">${pctTxt(p)}</span></div>`;
  }).join("");
  return card(title,html);
}
function detailHtml(s,D){
  const cols=D.date_cols, daily=D.mode=="daily", anIdx=cols.length-1;
  const avgHdr=daily?"Past-4wk avg (Wo4W)":"Prior-4wk avg (Wo4W)";
  const head="<tr><th>Metric</th>"+cols.map((c,i)=>`<th class="${daily&&i==anIdx?'an':''}">${c}${daily&&i==anIdx?'<br><span style="font-weight:400">analysis</span>':''}</th>`).join("")+`<th>${avgHdr}</th><th>WoW Δ%</th><th>Wo4W Δ%</th></tr>`;
  const dcell=x=>`<td><span class="chg ${cl(x)}">${pctTxt(x)}</span></td>`;
  const metricRow=m=>{
    const n=s[m];
    if(!n) return `<tr><td>${D.metric_labels[m]}</td>`+cols.map(()=>'<td class="flat">—</td>').join("")+'<td class="flat">—</td><td class="flat">n/a</td><td class="flat">n/a</td></tr>';
    const cells=n.vals.map((v,i)=>`<td class="${daily&&i==anIdx?'an':''}">${fmt(v)}</td>`).join("");
    return `<tr><td>${D.metric_labels[m]}</td>${cells}<td>${fmt(n.mean)}</td>${dcell(n.wow)}${dcell(n.wo4w)}</tr>`;
  };
  // Derived conversion-rate row (New Subs / Install) shown per date between the two.
  const convRow=()=>{
    const u=s["app_total_install"], d=s["app_total_new_subs"];
    if(!u||!d||!u.vals||!d.vals) return "";
    const cells=u.vals.map((_,i)=>{
      const r=convRate(d.vals[i],u.vals[i]);
      return `<td class="${daily&&i==anIdx?'an':''}">${r==null?'<span class="flat">n/a</span>':(r*100).toFixed(1)+'%'}</td>`;
    }).join("");
    const c=convCells(D,s,"app_total_install","app_total_new_subs");
    const avg=(c&&c.base!=null)?(c.base*100).toFixed(1)+'%':'<span class="flat">n/a</span>';
    return `<tr class="convrow"><td>Install → New Subs conversion</td>${cells}<td>${avg}</td>${dcell(c?c.wow:null)}${dcell(c?c.wo4w:null)}</tr>`;
  };
  let rows="";
  D.metric_order.forEach(m=>{ rows+=metricRow(m); if(m==="app_total_install") rows+=convRow(); });
  const h2=daily?"Analysis day vs WoW (last week) & Wo4W (past-4-week avg)":"This week vs WoW (prior week) & Wo4W (prior-4-week avg)";
  return card(h2+" · "+appName(D,S.app)+" · "+ctyName(D,S.cty),`<table><thead>${head}</thead><tbody>${rows}</tbody></table>`);
}
function byAppHtml(D){
  const cty="all", clbl=ctyName(D,"all");
  const osNote=hasOS(D)?" · OS = "+osName(D,S.os):"";
  let thead="<tr><th>Metric</th>"+D.apps.map(a=>`<th>${a[1]}</th>`).join("")+"</tr>";
  let rows=D.metric_order.map(m=>{
    let tds=D.apps.map(a=>{ const n=(sliceOf(D,a[0],cty)||{})[m];
      if(!n) return '<td class="flat">n/a</td>';
      return `<td>${fmt(last(n.vals))}<br><span class="chg ${cl(n.p)}">${pctTxt(n.p)}</span></td>`; }).join("");
    return `<tr><td>${D.metric_labels[m]}</td>${tds}</tr>`;
  }).join("");
  return card("Total — by app (country = "+clbl+osNote+")",`<table><thead>${thead}</thead><tbody>${rows}</tbody></table>`);
}
function byCountryHtml(D){
  return card("By Country",'<p class="sub" style="margin:0">No by-country views provided yet — fill the country rows in <code>metric_views_full.csv</code> to enable this section.</p>');
}
function dataGapsHtml(s,D){
  // A metric with no node, or an analysis-day value of 0 (an omitted Tableau row),
  // is a data gap — surfaced here rather than as a -100% move in the summary.
  const gaps=D.metric_order.filter(m=>{const n=s[m]; if(!n) return true; const v=last(n.vals); return v==null||v===0;})
    .map(m=>D.metric_labels[m]+((s[m]&&last(s[m].vals)===0)?" (value 0 — omitted/missing row)":""));
  return card("Data gaps disclosed", gaps.length?('<ul class="gaps">'+gaps.map(g=>`<li>${g}</li>`).join("")+'</ul>'):'<p>None.</p>');
}
function renderReport(block,srcDate){
  const D=block.data, s=sliceOf(D,S.app,S.cty)||{};
  const modeWord=D.mode=="weekly"?"Weekly":"Daily";
  const period=D.mode=="weekly"?weekRange(D):(last(D.date_cols)+" (analysis day, T-2)");
  const head=`<div class="rephead"><div>
      <div class="kick">Trending Report</div>
      <div class="h">${modeWord} report for <b>${appName(D,S.app)}</b> <span style="color:var(--muted)">(${srcDate})</span></div>
    </div><div style="flex:1"></div><button class="btn" onclick="window.print()">⬇ Download PDF</button></div>`;
  const meta='<div class="cmp" style="margin-top:0">Period: '+period+' · Country: '+ctyName(D,S.cty)+(hasOS(D)?' · OS: '+osName(D,S.os):'')+(D.mode=="weekly"&&srcDate!==S.date?(' · weekly source '+srcDate):'')+'</div>';
  document.getElementById("body").innerHTML=head+meta+'<div class="report">'+
    kpiHtml(s,D)+srcStripHtml(s,D)+execHtml(insList(D,block))+funnelHtml(s,D)+detailHtml(s,D)
    +byAppHtml(D)+srcCardHtml(s,D)+byCountryHtml(D)+dataGapsHtml(s,D)+'</div>';
  alignSrc();
}

/* ---------- events ---------- */
document.getElementById("nav").addEventListener("click",e=>{const a=e.target.closest("a[data-page]");if(!a)return;S.page=a.dataset.page;try{localStorage.setItem("pf_page",S.page)}catch(x){};refresh();});
document.getElementById("modeSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;S.mode=b.dataset.m;refresh();});
document.getElementById("appPill").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.app=b.dataset.a;refresh();});
document.getElementById("ctyPill").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.cty=b.dataset.c;refresh();});
document.getElementById("osPill").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;S.os=b.dataset.o;refresh();});
document.getElementById("dp").addEventListener("change",e=>{if(e.target.value){S.date=e.target.value;refresh();}});

(async()=>{
  try{
    INDEX=await (await fetch("./data/index.json",{cache:"no-store"})).json();
    if(!INDEX.dates||!INDEX.dates.length) throw new Error("No reports indexed.");
    S.date=INDEX.latest_daily||INDEX.dates[0].date;
    S.mode="daily";
    const dp=document.getElementById("dp");
    dp.value=S.date; dp.max=INDEX.dates[0].date; dp.min=INDEX.dates[INDEX.dates.length-1].date;
    document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.page===S.page));
    await refresh();
  }catch(e){
    document.getElementById("body").innerHTML='<div class="err"><b>Could not load data.</b><br>'+(e&&e.message||e)+
      '<br><br>Ensure <code>/docs/data/index.json</code> exists and GitHub Pages is enabled.</div>';
  }
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="https://www.perfectcorp.com/favicon.png" sizes="32x32">
<title>PERFECT · App Metrics Dashboard</title>
<style>
:root{ color-scheme: light;
  --bg:#f5f6f8; --card:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
  --brand:#e11d74; --blue:#2563eb; --pink:#db2777; --green:#059669; --red:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
.app{display:flex;min-height:100vh}
.side{width:212px;flex:none;background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{padding:4px 8px 18px}
.brand img{height:28px;width:auto;display:block}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#374151;text-decoration:none;font-weight:600;font-size:13.5px;cursor:pointer;margin-bottom:4px}
.nav a:hover{background:#f3f4f6}
.nav a.on{background:#fde7f1;color:var(--brand)}
.nav .ic{width:16px;height:16px;flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid var(--line);background:#fff}
.topbar .ttl{font-size:18px;font-weight:700}
.topbar .spacer{flex:1}
.datepick{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:#fff}
.datepick label{color:var(--muted);font-size:12px;font-weight:600}
.datepick input{border:0;font:inherit;color:var(--ink);outline:none}
.datepick select{border:0;font:inherit;color:var(--ink);outline:none;background:transparent;cursor:pointer;padding-right:2px;font-variant-numeric:tabular-nums}
.content{padding:20px 24px 48px;max-width:1920px;width:100%}
.controls{margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{appearance:none;border:0;background:#fff;color:var(--muted);padding:7px 16px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.seg button:disabled{color:#cbd1d9;cursor:not-allowed}
.row2{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.topbar{flex-wrap:wrap}
.seg button:disabled.on{background:#9ca3af;color:#fff}
.ctl{display:flex;align-items:center;gap:8px}
.ctl .cl{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.pill{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pill button{appearance:none;border:0;background:#fff;color:#4b5563;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.pill button.on{background:#eef2ff;color:var(--blue)}
.cmp{color:var(--muted);font-size:12px;margin:14px 0 16px}
/* shared delta colours (used by the report tiles) */
.up{color:var(--green)} .down{color:var(--red)}
/* summary-report header */
.rephead{display:flex;align-items:flex-end;gap:14px;border-left:3px solid var(--brand);padding:2px 0 2px 12px;margin-bottom:12px}
.rephead .kick{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.rephead .h{font-size:18px;font-weight:700}
.rephead .h b{color:var(--blue)}
.btn{appearance:none;border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:9px;padding:8px 14px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
/* ===== ported original report styling (scoped) ===== */
.report .grid{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
.report .tile{flex:1;min-width:192px;background:#fff;border:1px solid #e7ebf0;border-radius:12px;padding:16px 18px;box-shadow:0 1px 2px rgba(20,30,50,.05);text-align:center;}
.report .tile .k{font-size:12px;color:#6b7480;font-weight:600;}
.report .tile .v{font-size:26px;font-weight:700;margin:4px 0 6px;}
.report .chg{font-size:12.5px;font-weight:700;white-space:nowrap;}
.report .up{color:#2d7d46;} .report .down{color:#c0392b;} .report .flat{color:#6b7480;}
.report .deltas{display:flex;gap:14px;justify-content:center;}
.report .d{display:flex;flex-direction:column;gap:1px;align-items:center;}
.report .dl{font-size:9.5px;font-weight:700;color:#9aa3ad;letter-spacing:.05em;}
/* Install-by-source strip: laid out on the same flex row as the KPI tiles, with one
   invisible spacer per tile (and conversion connector) that precedes App Total Install,
   so the block's left edge lines up with that tile. A stub + top border draw the link. */
.report .srcrow{display:flex;margin:8px 0 6px;align-items:stretch;}
.report .srcrow.stack{flex-direction:column;gap:8px;}
.report .srcrow.stack .srcwrap{width:auto !important;flex:1 1 auto !important;margin-left:0 !important;}
/* Revenue by purchase type (Subscription / Pay as you go): right-hand block, purple accent */
.report .srcwrap.rt{margin-left:auto;border-top-color:#8e44ad;}
.report .srcwrap.rt::before{background:#8e44ad;}
.report .srcwrap.rt .srccap{color:#8e44ad;}
.report .srcwrap{position:relative;background:#fff;border:1px solid #e7ebf0;border-top:2px solid #2563eb;border-radius:12px;padding:11px 14px 12px;box-shadow:0 1px 2px rgba(20,30,50,.05);}
.report .srcwrap::before{content:"";position:absolute;top:-10px;left:var(--stub,26px);width:2px;height:10px;background:#2563eb;}
.report .srccap{font-size:10.5px;font-weight:700;color:#2563eb;letter-spacing:.05em;text-transform:uppercase;margin-bottom:9px;}
.report .srcstrip{display:flex;gap:10px;flex-wrap:wrap;}
.report .scell{flex:1;min-width:158px;background:#f8fafc;border:1px solid #eef1f4;border-radius:9px;padding:8px 11px;display:flex;flex-direction:column;gap:2px;text-align:left;}
.report .scell .sk{font-size:11px;font-weight:700;color:#6b7480;}
.report .scell .sv{font-size:19px;font-weight:700;line-height:1.15;}
.report .scell .ss{font-size:11px;color:#8a929c;margin-bottom:3px;}
.report .scell .deltas{gap:9px;justify-content:flex-start;}
.report .scell .d{align-items:flex-start;}
.report .scell .chg{font-size:11.5px;white-space:nowrap;}
.report .scell .dl{font-size:9px;}
.report .sbar{display:flex;height:13px;border-radius:7px;overflow:hidden;margin:2px 0 8px;background:#f0f3f7;}
.report .sbar span{display:block;height:13px;}
.report .sleg{display:flex;gap:16px;font-size:11.5px;color:#6b7480;flex-wrap:wrap;margin-bottom:12px;}
.report .sleg i,.report .sdot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;}
/* funnel conversion connector between two KPI tiles */
.report .conv{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:128px;padding:10px 6px;}
.report .conv .carrow{color:#c4ccd6;font-size:16px;line-height:1;margin-bottom:1px;}
.report .conv .ck{font-size:9.5px;color:#6b7480;font-weight:700;text-transform:uppercase;letter-spacing:.03em;text-align:center;line-height:1.2;}
.report .conv .cv{font-size:21px;font-weight:700;color:#2563eb;margin:1px 0 2px;}
.report .conv .deltas{gap:8px;}
.report .conv .dl{text-align:center;}
.report .card{background:#fff;border:1px solid #e7ebf0;border-radius:12px;padding:18px 20px;margin:14px 0;box-shadow:0 1px 2px rgba(20,30,50,.05);}
.report .card h2{font-size:14px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.04em;color:#39424f;}
.report .ins{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:13px;line-height:1.45;}
.report .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 auto;}
.report .ins b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:#9aa3ad;margin-bottom:1px;}
.report .ins .head{display:block;font-weight:700;font-size:14px;margin-bottom:2px;}
.report .ins .detail{display:block;color:#5b6470;font-size:12.5px;}
.report table{border-collapse:collapse;width:100%;font-size:13px;}
.report th,.report td{padding:9px 11px;text-align:right;border-bottom:1px solid #eef1f4;white-space:nowrap;}
.report th:first-child,.report td:first-child{text-align:left;}
.report thead th{background:#f7f9fb;font-weight:600;color:#39424f;}
.report th.an,.report td.an{background:#eef3ff;font-weight:700;}
.report tr.convrow td{background:#f7faff;}
.report tr.convrow td.an{background:#e6efff;}
.report tr.convrow td:first-child{color:#2563eb;font-weight:600;}
.report .fn{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px;}
.report .fn .name{width:150px;color:#39424f;}
.report .fn .track{position:relative;flex:1;height:16px;background:#f0f3f7;border-radius:8px;}
.report .fn .bar{position:absolute;top:0;height:16px;border-radius:8px;}
.report .fn .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#c4ccd6;}
.report .fn .val{width:66px;text-align:right;font-weight:600;}
.report .fn.div .name{font-weight:700;}
.report .sub{color:#6b7480;font-size:12.5px;}
.report ul.gaps{margin:4px 0;padding-left:18px;font-size:12px;color:#6b7480;}
.foot{color:var(--muted);font-size:11.5px;margin-top:18px}
/* Unavailable installs page + Total-view Install subline (2026-11-17) */
.nav a.subnav{padding-left:30px;font-size:13px}
.report .tile .us{font-size:11.5px;color:#6b7480;line-height:1.35}
.report .tile .us b{color:#39424f;font-weight:600}
.report .tile .usub{font-size:11px;color:#b45309;font-weight:600;margin:-2px 0 5px}
.report .tw{overflow-x:auto}
.report .ulink{color:var(--blue);font-weight:600;cursor:pointer;white-space:nowrap}
.report tr[data-slice]{cursor:pointer}
.report tr[data-slice]:hover td{background:#f8fafc}
.report tr.cur td{background:#fff7ed}
.report .warnbar{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;margin:0 0 12px;font-size:12.5px}
.report .uchart svg{width:100%;height:auto;display:block}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:14px;margin:14px 0}
.load{color:var(--muted);padding:40px 0;text-align:center}
/* Narrow effective viewport (boss screen: 150% DPI + Chrome zoom 110-125% collapses
   the CSS viewport to ~1024-1164px). Tighten the report KPI row so all 4 tiles +
   the conversion connector stay on one line and Revenue is not pushed below. */
@media(max-width:1200px){
  .report .grid{gap:8px;}
  .report .tile{min-width:120px;padding:12px 8px;}
  .report .tile .v{font-size:20px;margin:3px 0 5px;}
  .report .deltas{gap:6px;}
  .report .chg{font-size:11px;}
  .report .dl{font-size:9px;}
  .report .conv{min-width:84px;padding:8px 4px;}
  .report .conv .carrow{font-size:14px;}
  .report .conv .cv{font-size:17px;}
  .report .conv .ck{font-size:9px;}
  .report .conv .deltas{gap:4px;}
  /* breakdown cells: let 3 (install) + 2 (purchase type) cells shrink without spilling */
  .report .scell{min-width:0;padding:7px 8px;}
  .report .scell .deltas{gap:5px;flex-wrap:wrap;}
  .report .scell .chg{font-size:10.5px;}
  .report .scell .sv{font-size:17px;}
}
@media(max-width:820px){.side{display:none}
  /* no room to hang off a tile on a phone: drop the spacers and run full width */
  .report .srcwrap{margin-left:0 !important}}
@media print{.side,.topbar .datepick,.topbar .seg,.controls,.btn{display:none!important}.topbar{border:0}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="https://d3ss46vukfdtpo.cloudfront.net/static/media/PERFECT_logo_newcolor.ff00d06d.svg" alt="PERFECT"></div>
    <nav class="nav" id="nav">
      <!-- Live Dashboard removed 2026-09-01 (chart page retired). The nav is kept so
           further pages / split-out views can be added back here. -->
      <a data-page="report" class="on">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
        Summary Report
      </a>
      <a data-page="unav" class="subnav">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        Unavailable installs
      </a>
    </nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="ttl" id="ttl">Summary Report</div>
      <div class="spacer"></div>
      <!-- Install basis + period toggles sit next to the date picker (2026-11-17). -->
      <div class="seg" id="instSeg" style="display:none" title="App Total Install basis">
        <button data-i="total">Total</button>
        <button data-i="excl">Exclude Unavailable</button>
      </div>
      <div class="seg" id="modeSeg" style="display:none">
        <button data-m="daily">Daily</button>
        <button data-m="weekly">Weekly</button>
      </div>
      <div class="datepick"><label for="dp" id="dpLbl">Date</label><input type="date" id="dp"><select id="wkSel" style="display:none" aria-label="Week"></select></div>
    </div>
    <div class="content">
      <div class="controls" id="controls" style="display:none">
        <div class="row2">
          <div class="ctl"><span class="cl">App</span><div class="pill" id="appPill"></div></div>
          <div class="ctl"><span class="cl">Country</span><div class="pill" id="ctyPill"></div></div>
          <div class="ctl" id="osCtl" style="display:none"><span class="cl">OS</span><div class="pill" id="osPill"></div></div>
        </div>
        <div class="cmp" id="cmp"></div>
      </div>
      <div id="body"><div class="load">Loading latest data…</div></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>
</div>

<script>
let INDEX=null, CACHE={};
/* Only the Summary Report page remains (the Live Dashboard was retired 2026-09-01).
   S.page is kept so a second page can be re-introduced without reworking the nav. */
/* inst = App Total Install basis: "excl" (Exclude Unavailable, default) | "total". */
const S={page:"report",date:null,mode:"daily",inst:"excl",app:"all_app",cty:"all",os:"ios"};
try{ const sv=localStorage.getItem("pf_page"); if(sv&&sv!=="live") S.page=sv; }catch(e){}

/* shared helpers */
function last(a){ return a[a.length-1]; }
function fmt(n){ return (n==null)?"n/a":Math.round(n).toLocaleString("en-US"); }
function pctTxt(x){ return (x==null)?"n/a":((x>=0?"+":"")+(x*100).toFixed(1)+"%"); }
function cl(x){ return (x==null)?"flat":(x>0?"up":(x<0?"down":"flat")); }
function cls(x){ return x>=0?"up":"down"; }
function pct(x){ return (x>=0?"+":"")+(x*100).toFixed(1)+"%"; }
function median(a){const s=a.filter(v=>v!=null).slice().sort((p,q)=>p-q);if(!s.length)return null;const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function appName(D,key){ const a=D.apps.find(x=>x[0]===key); return a?a[1]:key; }
function ctyName(D,key){ const c=D.countries.find(x=>x[0]===key); return c?c[1]:key; }
/* OS axis (added 2026-08). Reports built before the OS split have a 2-level
   cube[app][cty] and no D.oses. The all_os aggregate was later removed (Android
   install lags ~14d, so an iOS+Android total misreads the funnel) — the axis is now
   iOS (the default/anchor) + Android. Legacy reports may still carry an all_os layer;
   osKeys()/sliceOf() keep the page working across all three shapes. */
function hasOS(D){ return Array.isArray(D.oses) && D.oses.length>0; }
function osName(D,key){ const o=(D.oses||[]).find(x=>x[0]===key); return o?o[1]:key; }
/* Never surface the legacy all_os aggregate in the switcher. */
function osKeys(D){ return (D.oses||[]).filter(o=>o[0]!=="all_os"); }
/* Install basis (added 2026-11-17). Reports with install_basis="excl_unavailable" carry
   Install EXCLUDING Unavailable installs in D.cube (the default view) and the raw Total
   nodes for the affected cells in D.cube_total. Older reports only have the Total, so
   the Exclude option is unavailable for them. */
function hasExcl(D){ return D.install_basis==="excl_unavailable"; }
function effInst(D){ return hasExcl(D)?S.inst:"total"; }
function sliceOf(D,app,cty){
  const c=((D.cube||{})[app]||{})[cty];
  if(!c) return null;
  if(!hasOS(D)) return c;                        // legacy 2-level cube
  const k=c[S.os]?S.os:(c.ios?"ios":(c.all_os?"all_os":Object.keys(c)[0]));  // OS layer
  const base=c[k]||null;
  if(!base || effInst(D)!=="total") return base;
  const ov=(((D.cube_total||{})[app]||{})[cty]||{})[k];
  return ov?Object.assign({},base,ov):base;      // Total overlay on the affected metrics
}
function weekRange(D){ const t=(D.date_cols||[]).find(c=>/^This/.test(c)); return t? t.replace(/^This\s*/,"").replace(/(\d\d-\d\d)-(\d\d-\d\d)/,"$1 – $2") : ""; }

/* ---------- analysis-day vs report-file date ----------
   Report JSON files are keyed by the *run* date (S.date, the computation date). The
   number a reader cares about is the *analysis day* (the day the data is for), which
   lags the run by 2 days (or 3 on an --offset-days fallback). These helpers convert
   between the two so the title and the date picker speak analysis-day, while file
   lookups keep using the run date. */
const ANALYSIS_LAG=2;
function isoAddDays(iso,n){ const d=new Date(iso+"T00:00:00Z"); if(isNaN(d)) return iso; d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function toAnalysisDay(fileISO){ return isoAddDays(fileISO,-ANALYSIS_LAG); }   // run date -> analysis day (picker bounds)
function toFileDay(analysisISO){ return isoAddDays(analysisISO,ANALYSIS_LAG); } // analysis day -> run date (file lookup)
/* True analysis day (daily): resolve the analysis column's MM-DD against the run date
   so the year is right across a year boundary or an --offset-days fallback. */
function analysisDayISO(D,srcDate){
  const mmdd=last(D.date_cols||[]); if(!mmdd) return toAnalysisDay(srcDate);
  for(let k=0;k<=14;k++){ const c=isoAddDays(srcDate,-k); if(c.slice(5)===mmdd) return c; }
  return toAnalysisDay(srcDate);
}
/* Analysis week's end day (weekly) — used to position the single-date picker in
   analysis space (the picker cannot render a range). */
function weekEndISO(D,srcDate){
  const t=(D.date_cols||[]).find(c=>/^This/.test(c)), m=t&&t.match(/\d\d-\d\d-(\d\d-\d\d)/);
  if(!m) return toAnalysisDay(srcDate);
  for(let k=0;k<=21;k++){ const c=isoAddDays(srcDate,-k); if(c.slice(5)===m[1]) return c; }
  return toAnalysisDay(srcDate);
}
/* 3-letter weekday (e.g. Tue) appended to the title dates for quick day-of-week reads. */
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function wdOf(iso){ const d=new Date(iso+"T00:00:00Z"); return isNaN(d)?"":WD[d.getUTCDay()]; }
/* Weekly range with a weekday on each end, e.g. "09-13 Sun – 09-19 Sat". Both ends
   are resolved to full dates (against the run date) so the weekday is accurate. */
function weekRangeLabeled(D,srcDate){
  const t=(D.date_cols||[]).find(c=>/^This/.test(c)), m=t&&t.match(/(\d\d-\d\d)-(\d\d-\d\d)/);
  if(!m) return weekRange(D);
  const end=weekEndISO(D,srcDate); let start=null;
  for(let k=0;k<=13;k++){ const c=isoAddDays(end,-k); if(c.slice(5)===m[1]){ start=c; break; } }
  const s=start?(m[1]+" "+wdOf(start)):m[1];
  return s+" – "+m[2]+" "+wdOf(end);
}

/* AI Sharing Hub build (scripts/build_hub.py): data ships as <script> chunks instead of
   JSON files — data/index.js sets window.__HUB_INDEX, and each report is split into
   data/r-<date>-<n>.js files that push string parts into window.__R[date]. */
function loadScript(src){
  return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;
    s.onerror=()=>no(new Error("Could not load "+src));document.head.appendChild(s);});
}
async function getReport(date){
  if(CACHE[date]) return CACHE[date];
  if(window.__HUB_INDEX){
    const n=(INDEX.parts||{})[date];
    if(!n) throw new Error("No report file for "+date);
    window.__R=window.__R||{};
    await Promise.all(Array.from({length:n},(_,i)=>loadScript("./data/r-"+date+"-"+i+".js")));
    let txt=window.__R[date].join(""); delete window.__R[date];
    if(INDEX.enc==="gzip-b64"){   // base64(gzip(json)) — keeps the package under the Hub's size cap
      const bin=Uint8Array.from(atob(txt),c=>c.charCodeAt(0));
      txt=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    }
    CACHE[date]=JSON.parse(txt);
    return CACHE[date];
  }
  const r=await fetch("./data/report_"+date+".json",{cache:"no-store"});
  if(!r.ok) throw new Error("No report file for "+date+" (HTTP "+r.status+")");
  CACHE[date]=await r.json(); return CACHE[date];
}
function resolveWeekly(date){ for(const d of (INDEX.weekly_dates||[])){ if(d<=date) return d; } return null; }

/* ---------- weekly week picker ----------
   In Weekly mode the single-date picker is swapped for a week <select> listing each
   analysis week as "YYYY/MM/DD ~ YYYY/MM/DD" (newest first). Weeks come from
   index.json `weekly_weeks` (built by build_web.py from each report's date column);
   older indexes without it fall back to "last completed Sun–Sat week before the run date". */
function slashed(iso){ return iso.replace(/-/g,"/"); }
function fallbackWeek(run){ const d=new Date(run+"T00:00:00Z"), back=((d.getUTCDay()+1)%7)||7, end=isoAddDays(run,-back); return {start:isoAddDays(end,-6),end,date:run,runs:[run]}; }
function weekList(){
  if(Array.isArray(INDEX.weekly_weeks) && INDEX.weekly_weeks.length) return INDEX.weekly_weeks;
  const m={}; (INDEX.weekly_dates||[]).forEach(r=>{ const w=fallbackWeek(r), k=w.end; if(!m[k]) m[k]=w; else m[k].runs.push(r); });
  return Object.values(m).sort((a,b)=>a.end<b.end?1:-1);
}
function weekOfRun(run){ return weekList().find(w=>(w.runs||[w.date]).includes(run)) || null; }
function syncDatePicker(srcDate){
  const weekly=S.mode==="weekly", dp=document.getElementById("dp"), ws=document.getElementById("wkSel");
  dp.style.display=weekly?"none":""; ws.style.display=weekly?"":"none";
  document.getElementById("dpLbl").textContent=weekly?"Week":"Date";
  document.getElementById("dpLbl").htmlFor=weekly?"wkSel":"dp";
  if(!weekly) return;
  const wl=weekList();
  if(ws.options.length!==wl.length) ws.innerHTML=wl.map(w=>`<option value="${w.date}">${slashed(w.start)} ~ ${slashed(w.end)}</option>`).join("");
  const cur=weekOfRun(srcDate); if(cur) ws.value=cur.date;
}

/* ---------- dispatch ---------- */
async function refresh(){
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.page===S.page));
  const dailyAvail=(INDEX.daily_dates||[]).includes(S.date);
  const wkSrc=resolveWeekly(S.date), weeklyAvail=!!wkSrc;
  if(S.mode==="daily" && !dailyAvail && weeklyAvail) S.mode="weekly";
  if(S.mode==="weekly" && !weeklyAvail && dailyAvail) S.mode="daily";

  let block,srcDate;
  try{
    if(S.mode==="daily"){ const rep=await getReport(S.date); block=rep.daily; srcDate=S.date; if(!block) throw new Error("No daily report for "+S.date); }
    else { const rep=await getReport(wkSrc); block=rep.weekly; srcDate=wkSrc; if(!block) throw new Error("No weekly report on/before "+S.date); }
  }catch(e){
    document.getElementById("controls").style.display="none";
    document.getElementById("body").innerHTML='<div class="err"><b>No report available.</b><br>'+(e.message||e)+
      '<br><br>Available daily: '+(INDEX.daily_dates||[]).join(", ")+'<br>Available weekly: '+(INDEX.weekly_dates||[]).join(", ")+'</div>';
    return;
  }
  const D=block.data;
  if(!D.apps.some(a=>a[0]===S.app)) S.app="all_app";
  if(!D.countries.some(c=>c[0]===S.cty)) S.cty=D.countries[0][0];
  // Keep the OS selection valid for the current app/country. Prefer iOS (the anchor);
  // otherwise the first available OS. all_os is never selected (removed).
  if(hasOS(D) && !(((D.cube[S.app]||{})[S.cty]||{})[S.os])){
    const av=osKeys(D).map(o=>o[0]).filter(o=>((D.cube[S.app]||{})[S.cty]||{})[o]);
    S.os = av.includes("ios") ? "ios" : (av[0] || "ios");
  }
  syncControls(D,dailyAvail,weeklyAvail);
  document.getElementById("ttl").textContent=S.page==="unav"?"Unavailable installs":"Summary Report";
  if(S.page==="unav") renderUnav(block,srcDate); else renderReport(block,srcDate);
  document.getElementById("foot").textContent="Source: data-auto-analyzer / metric-analysis · reads the latest JSON committed in /docs/data."+
    (S.mode==="weekly" && srcDate!==S.date ? "  ·  Weekly source: "+srcDate+" (most recent Monday report ≤ selected date)" : "");
}

/* ---------- Summary Report (faithful reproduction of the daily/weekly report) ---------- */
function card(title,inner){ return `<div class="card"><h2>${title}</h2>${inner}</div>`; }
function deltaChip(label,x){
  if(x==null) return `<span class="d"><span class="dl">${label}</span><span class="chg flat">n/a</span></span>`;
  const arr=x>0?"▲":(x<0?"▼":"■");
  return `<span class="d"><span class="dl">${label}</span><span class="chg ${cl(x)}">${arr} ${pctTxt(x)}</span></span>`;
}
/* Signal colours (item 4): green = positive, orange = caution, red = warning,
   slate = neutral/informational. Keyed off each insight's `tone` from the backend. */
const TONE={good:{dot:"#059669",head:"#047857"},warn:{dot:"#e67e22",head:"#b45309"},
            alert:{dot:"#dc2626",head:"#b91c1c"},info:{dot:"#64748b",head:"#334155"}};
const TONE_RANK={alert:0,warn:1,good:2,info:3};
function toneOf(o){ return TONE[o.tone]||TONE.info; }
/* Per-slice executive summary: prefer DATA.insights[app][cty], fall back to the
   app's All-country set, then to the legacy global MD bullets. */
function insList(D,block){
  // insights are keyed [app][cty] (legacy) or [app][cty][os] (OS-aware). pick(x)
  // returns the list, descending into the OS layer when present.
  const pick=x=>!x?null:(hasOS(D)?(x[S.os]||x.ios||x.all_os||null):x);
  const bag=(D.insights||{})[S.app];
  if(bag){ const v=pick(bag[S.cty]); if(v) return v; const va=pick(bag.all); if(va) return va; }
  return (block.insights||[]).map(o=>{
    const i=(o.title||"").indexOf(" — ");
    return {kick:i>=0?o.title.slice(0,i):(o.title||""),
            head:i>=0?o.title.slice(i+3):"", body:o.body, tone:"info"};
  });
}
function execHtml(list,D){
  list=(list||[]).slice().sort((a,b)=>(TONE_RANK[a.tone]??3)-(TONE_RANK[b.tone]??3));
  // The summary is computed once, on Install excluding Unavailable; say so in Total view.
  const note=(D&&hasExcl(D)&&effInst(D)==="total")
    ?'<p class="sub" style="margin:-4px 0 6px">Summary is based on Install excluding Unavailable installs.</p>':"";
  const rows=list.map(o=>{
    const c=toneOf(o);
    const head=o.head?`<span class="head" style="color:${c.head}">${o.head}</span>`:"";
    const lk=(D&&D.unav&&o.kick==="Unavailable installs")?' <a class="ulink" data-goto="unav">Open Unavailable installs report &rarr;</a>':"";
    return `<div class="ins"><span class="dot" style="background:${c.dot}"></span><span><b>${o.kick}</b>${head}<span class="detail">${o.body}${lk}</span></span></div>`;
  }).join("");
  return card("Executive Summary",note+rows);
}
/* Funnel conversion rate = down / up (e.g. New Subs / Install), with WoW & Wo4W
   as percentage-point deltas. Computed from the cube's per-date values so it tracks
   the switcher. A 0/missing denominator (an omitted row) yields n/a, not a bogus rate. */
function convCells(D,s,upKey,downKey){
  const u=s[upKey], d=s[downKey];
  if(!u||!d||!u.vals||!d.vals) return null;
  const ai=u.vals.length-1;
  const rate=(dv,uv)=>(uv==null||uv===0||dv==null)?null:(dv/uv);
  const now=rate(last(d.vals),last(u.vals));
  const wi=(D.mode=="daily")?ai-1:0;                 // one period before (WoW baseline)
  const wowBase=(wi>=0)?rate(d.vals[wi],u.vals[wi]):null;
  // DoD (daily only): conversion on the previous calendar day, from each metric's
  // prev-day value (pv), computed server-side since vals[] are same-weekday baselines.
  const dodBase=(D.mode=="daily")?rate(d.pv,u.pv):null;
  let w4Base=null;
  if(D.mode=="daily"){                                // mean of the baseline weeks' ratios
    const rs=[]; for(let k=0;k<ai;k++){const r=rate(d.vals[k],u.vals[k]); if(r!=null) rs.push(r);}
    if(rs.length) w4Base=rs.reduce((a,b)=>a+b,0)/rs.length;
  } else { w4Base=rate(d.mean,u.mean); }
  // DoD / WoW / Wo4W as relative % change (same unit as the KPI tiles), not pp.
  return {now, base:w4Base,
               dod:(now!=null&&dodBase)?(now-dodBase)/dodBase:null,
               wow:(now!=null&&wowBase)?(now-wowBase)/wowBase:null,
               wo4w:(now!=null&&w4Base)?(now-w4Base)/w4Base:null};
}
function convRate(dv,uv){ return (uv==null||uv===0||dv==null)?null:dv/uv; }
function convConnector(D,s,upKey,downKey){
  const c=convCells(D,s,upKey,downKey);
  const rateTxt=(c&&c.now!=null)?(c.now*100).toFixed(1)+"%":"n/a";
  const shrt=k=>D.metric_labels[k].replace("App Total ","");
  const dodChip=(D.mode=="daily")?deltaChip("DoD",c?c.dod:null):"";
  return `<div class="conv"><div class="carrow">▸</div><div class="ck">${shrt(upKey)} → ${shrt(downKey)}<br>conversion</div><div class="cv">${rateTxt}</div><div class="deltas">${dodChip}${deltaChip("WoW",c?c.wow:null)}${deltaChip("Wo4W",c?c.wo4w:null)}</div></div>`;
}
/* Insert a conversion connector after these upstream tiles (up → next count layer). */
const CONV_AFTER={app_total_install:"app_total_new_subs"};
/* Total view: say how much of the Install figure is Unavailable (count + share only —
   no WoW/Wo4W: Unavailable comes in bursts over a near-zero base, so % changes mislead). */
function unavSubline(D,m,v){
  if(m!==D.source_parent||!hasExcl(D)||effInst(D)!=="total"||v==null) return "";
  const e=rawNode(D,S.app,S.cty,m), ev=e?last(e.vals):null;
  if(ev==null||v-ev<=0) return "";
  return `<div class="usub">incl. ${fmt(v-ev)} Unavailable (${(v?(v-ev)/v*100:0).toFixed(1)}%)</div>`;

function kpiHtml(s,D){
  const parts=[];
  D.metric_order.forEach(m=>{
    const n=s[m], v=n?last(n.vals):null;
    const dodChip=(D.mode=="daily")?deltaChip("DoD",n?n.dod:null):"";
    parts.push(`<div class="tile" data-m="${m}"><div class="k">${D.metric_labels[m]}</div><div class="v">${fmt(v)}</div>${unavSubline(D,m,v)}<div class="deltas">${dodChip}${deltaChip("WoW",n?n.wow:null)}${deltaChip("Wo4W",n?n.wo4w:null)}</div></div>`);
    const dn=CONV_AFTER[m];
    if(dn && D.metric_order.includes(dn)) parts.push(convConnector(D,s,m,dn));
  });
  return '<div class="grid">'+parts.join("")+'</div>';
}
/* ---------- Breakdowns: Install by source + Revenue by purchase type ----------
   One row under the KPI tiles (Jerry's mockup, 2026-10-14):
     • Install by source — left-aligned, from the row's left edge up to New Subs
     • Revenue by purchase type (Subscription / Pay as you go) — spans New Subs → Revenue,
       flush right.
   Each block's connector stub sits under its own parent tile. Install sources do NOT
   sum to Install (PPC left out on purpose); the two purchase types DO sum to Revenue.
   Older reports without revtype_* simply show the Install block alone. */
const SRC_COLORS=["#059669","#2563eb","#e67e22","#8e44ad"];
const RT_COLORS=["#8e44ad","#e67e22"];
function bkSpecs(D){
  const out=[];
  if((D.source_order||[]).length&&D.source_parent)
    out.push({kind:"source",order:D.source_order,labels:D.source_labels,parent:D.source_parent,
              word:"by source",col:"Source",colors:SRC_COLORS,partition:false});
  if((D.revtype_order||[]).length&&D.revtype_parent)
    out.push({kind:"revtype",order:D.revtype_order,labels:D.revtype_labels,parent:D.revtype_parent,
              word:"by purchase type",col:"Type",colors:RT_COLORS,partition:true});
  return out;
}
function sliceCap(D){ return appName(D,S.app)+" &middot; "+ctyName(D,S.cty)+(hasOS(D)?" &middot; "+osName(D,S.os):""); }
const SRC_MIN_W=480, RT_MIN_W=340, BK_GAP=14;
function alignSrc(){
  const row=document.querySelector(".report .srcrow"), grid=document.querySelector(".report .grid");
  if(!row||!grid) return;
  const g=grid.getBoundingClientRect();
  const L=row.querySelector('.srcwrap[data-kind="source"]'), R=row.querySelector('.srcwrap[data-kind="revtype"]');
  const tiles=[...grid.querySelectorAll(".tile")];
  const tileOf=k=>tiles.find(t=>t.dataset.m===k)||null;
  let stacked=window.innerWidth<=820;
  [L,R].forEach(w=>{ if(w){ w.style.width=""; w.style.flex=""; w.style.marginLeft=""; }});
  if(R&&!stacked){
    const rp=tileOf(R.dataset.parent), i=tiles.indexOf(rp), anchor=i>0?tiles[i-1]:rp;
    const start=anchor?anchor.getBoundingClientRect().left-g.left:0;
    if(!anchor||g.width-start<RT_MIN_W||(L&&start-BK_GAP<SRC_MIN_W)) stacked=true;
    if(!stacked){ R.style.flex="0 0 auto"; R.style.width=(g.width-start).toFixed(1)+"px";
      if(L){ L.style.flex="0 0 auto"; L.style.width=(start-BK_GAP).toFixed(1)+"px"; } }
  }
  row.classList.toggle("stack",stacked);
  [L,R].forEach(w=>{ if(!w) return; const t=tileOf(w.dataset.parent), wr=w.getBoundingClientRect();
    let off=t?(t.getBoundingClientRect().left-wr.left+26):26;
    off=Math.max(14,Math.min(off,wr.width-20));
    w.style.setProperty("--stub",off.toFixed(0)+"px"); });
}
window.addEventListener("resize",alignSrc);
function bkStrip(sp,s,D){
  const parent=s[sp.parent], ptot=parent?last(parent.vals):null, daily=D.mode=="daily";

}
function srcStripHtml(s,D){

}
function srcCardHtml(s,D){ return bkSpecs(D).map(sp=>bkCard(sp,s,D)).join(""); }
function funnelHtml(s,D){
  const lagged=new Set(D.lagged||[]);

  const have=pts.map(x=>x[1]).filter(v=>v!=null);
  const title="Funnel — same-period change by layer · "+appName(D,S.app)+" · "+ctyName(D,S.cty);
  if(!have.length) return card(title,'<p class="sub" style="margin:0">No data for this slice.</p>');
  const acq=pts.filter(([m,p])=>p!=null && !lagged.has(m)).map(x=>x[1]);
  const cons=median(acq.length?acq:have), dth=D.divergence_threshold, scale=Math.max(...have.map(Math.abs),0.05);
  let html=`<div class="sub" style="margin:-4px 0 10px">Acquisition consensus ${pctTxt(cons)} · orange outline = conversion diverges &gt; ${(dth*100).toFixed(0)}pp · lagged metric greyed</div>`;
  html+=pts.map(([m,p])=>{

/* ---------- Unavailable installs page (added 2026-11-17) ----------
   Reads D.unav (analyze.py _unav_block): day-level Total Install (t), Unavailable (u),
   New User (nu) and Unavailable by source (src) for the last 42 days, per cell that had
   any Unavailable. Counts are compared with counts (last period, 4-period average) —
   never as % change, since Unavailable arrives in bursts over a near-zero base. The
   Total vs Exclude % changes come from cube / cube_total. */
const U_COL={ex:"#cbd5e1",un:"#e67e22",nu:"#2563eb",hi:"#fff7ed"};
function rawNode(D,app,cty,m){
  const c=((D.cube||{})[app]||{})[cty]; if(!c) return null;
  const o=hasOS(D)?(c[S.os]||null):c; return o?(o[m]||null):null;
}
function totNode(D,app,cty,m){ return ((((D.cube_total||{})[app]||{})[cty]||{})[S.os]||{})[m]||rawNode(D,app,cty,m); }
function uCell(U,app,cty,os){ return (((U.cells||{})[app]||{})[cty]||{})[os||S.os]||null; }
function uSum(a,i0,i1){ if(!a||i0<0) return null; let s=0,n=0; for(let i=i0;i<=i1;i++){ if(a[i]!=null){s+=a[i];n++;} } return n?s:null; }

   step back 7 days, so one formula covers both modes. */
function uStats(U,a){
  const i0=U.dates.indexOf(U.period[0]), i1=U.dates.indexOf(U.period[1]);
  const back=k=>uSum(a,i0-7*k,i1-7*k), ps=[1,2,3,4].map(back).filter(v=>v!=null);
  return {now:uSum(a,i0,i1), last:back(1), avg:ps.length?ps.reduce((x,y)=>x+y,0)/ps.length:null};
}
function shareTxt(n,d){ return (n==null||!d)?"n/a":(n/d*100).toFixed(1)+"%"; }
function uSliceTxt(D){ return appName(D,S.app)+" &middot; "+ctyName(D,S.cty)+(hasOS(D)?" &middot; "+osName(D,S.os):""); }
function uTilesHtml(D,U){
  const daily=D.mode==="daily", cell=uCell(U,S.app,S.cty), P=D.source_parent;
  const z={now:0,last:0,avg:0}, us=cell?uStats(U,cell.u):z;
  const tn=totNode(D,S.app,S.cty,P), en=rawNode(D,S.app,S.cty,P);
  const ts=cell?uStats(U,cell.t):{now:tn?last(tn.vals):null,last:null,avg:null};
  const lastLbl=daily?"Same weekday last week":"Last week", avgLbl=daily?"Past-4-wk avg":"Prior-4-wk avg";

  const t1=`<div class="tile"><div class="k">Unavailable installs</div><div class="v" style="color:${U_COL.un}">${fmt(us.now)}</div>${ln(lastLbl,fmt(us.last))}${ln(avgLbl,fmt(us.avg))}</div>`;
  const t2=`<div class="tile"><div class="k">Share of Total Install</div><div class="v">${shareTxt(us.now,ts.now)}</div>${ln(lastLbl,shareTxt(us.last,ts.last))}${ln(avgLbl,shareTxt(us.avg,ts.avg))}</div>`;
  const t3=`<div class="tile"><div class="k">${D.metric_labels[P]||"App Total Install"} (excl. Unavailable)</div><div class="v">${fmt(en?last(en.vals):null)}</div>${ln("Total incl. Unavailable",fmt(tn?last(tn.vals):null))}</div>`;
  const nu=rawNode(D,S.app,S.cty,"app_total_new_user");

function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x||1))), f=x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function uTrendHtml(D,U){
  const weekly=D.mode==="weekly", cell0=uCell(U,S.app,S.cty);
  const title=(weekly?"Weekly trend, last 6 weeks":"Daily trend, last 6 weeks")+" &middot; "+uSliceTxt(D);
  if(!cell0) return card(title,'<p class="sub" style="margin:0">No Unavailable installs in the last 6 weeks for this slice.</p>');
  // Days before the data window starts (Total Install 0/missing) are left out; in Weekly a
  // week that starts before the first data day is partial, so it is left out too.
  const s0=Math.max(0,cell0.t.findIndex(v=>v));
  const pi0=U.dates.indexOf(U.period[0]), pi1=U.dates.indexOf(U.period[1]);
  const B=[];   // bars: {lab, tip, t, u, nu, hi}
  if(weekly){
    // dates end on the analysis week's Saturday, so 7-day groups from the end are Sun–Sat weeks.
    for(let e=U.dates.length-1;e-6>=s0;e-=7){
      const b=e-6, sm=a=>uSum(a,b,e), d0=U.dates[b], d1=U.dates[e];
      B.unshift({lab:d0.slice(5), tip:`${d0} – ${d1}`, t:sm(cell0.t), u:sm(cell0.u), nu:sm(cell0.nu), hi:e===pi1});
    }
  } else {
    for(let i=s0;i<U.dates.length;i++){ const d=U.dates[i];
      B.push({lab:((U.dates.length-1-i)%7===0)?d.slice(5):"", tip:`${d} ${wdOf(d)}`, t:cell0.t[i], u:cell0.u[i], nu:cell0.nu[i], hi:i>=pi0&&i<=pi1}); }
  }
  const n=B.length, W=1000, H=250, L=56, R=8, T=10, Bm=28, cw=(W-L-R)/Math.max(n,1), bw=Math.max(2,cw*(weekly?0.55:0.72));
  const mx=Math.max(1,...B.map(b=>b.t||0),...B.map(b=>b.nu||0)), st=niceStep(mx/4), top=Math.ceil(mx/st)*st;
  const y=v=>T+(H-T-Bm)*(1-v/top), x=i=>L+cw*i+(cw-bw)/2;
  let g="";
  B.forEach((b,i)=>{ if(b.hi) g+=`<rect x="${(L+cw*i).toFixed(1)}" y="${T}" width="${cw.toFixed(1)}" height="${H-T-Bm}" fill="${U_COL.hi}"/>`; });
  for(let v=0;v<=top+1e-9;v+=st){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#eef1f4"/><text x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#6b7480">${fmt(v)}</text>`; }
  B.forEach((b,i)=>{
    const tv=b.t||0, uv=b.u||0, ex=Math.max(0,tv-uv);
    g+=`<g><title>${b.tip} · Total Install ${fmt(b.t)} · Unavailable ${b.u==null?"no data yet":fmt(b.u)} (${shareTxt(b.u,b.t)}) · Excl. Unavailable ${fmt(ex)} · New User ${fmt(b.nu)}</title>`
      +`<rect x="${(L+cw*i).toFixed(1)}" y="${T}" width="${cw.toFixed(1)}" height="${H-T-Bm}" fill="transparent"/>`
      +`<rect x="${x(i).toFixed(1)}" y="${y(ex).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(0)-y(ex)).toFixed(1)}" fill="${U_COL.ex}"/>`
      +(uv>0?`<rect x="${x(i).toFixed(1)}" y="${y(tv).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(ex)-y(tv)).toFixed(1)}" fill="${U_COL.un}"/>`:"")
      +`</g>`;
    if(weekly&&uv>0) g+=`<text x="${(L+cw*i+cw/2).toFixed(1)}" y="${(y(tv)-5).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="${U_COL.un}" pointer-events="none">${fmt(uv)}</text>`;
    if(b.lab) g+=`<text x="${(L+cw*i+cw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#6b7480">${weekly?b.lab+" wk":b.lab}</text>`;
  });
  const pts=B.map((b,i)=>b.nu==null?null:`${(L+cw*i+cw/2).toFixed(1)},${y(b.nu).toFixed(1)}`).filter(Boolean).join(" ");
  g+=`<polyline points="${pts}" fill="none" stroke="${U_COL.nu}" stroke-width="2" pointer-events="none"/>`;
  if(weekly) B.forEach((b,i)=>{ if(b.nu!=null) g+=`<circle cx="${(L+cw*i+cw/2).toFixed(1)}" cy="${y(b.nu).toFixed(1)}" r="3" fill="${U_COL.nu}" pointer-events="none"/>`; });
  const leg=`<div class="sleg"><span><i style="background:${U_COL.ex}"></i>Install excl. Unavailable</span><span><i style="background:${U_COL.un}"></i>Unavailable</span><span><i style="background:${U_COL.nu};height:3px;vertical-align:middle"></i>New User</span><span><i style="background:${U_COL.hi};border:1px solid #fed7aa"></i>${weekly?"Analysis week":"Analysis day"}</span></div>`;
  const note=weekly?"Each bar is one Sun–Sat week (label = week start); bar height = Total Install, the orange top and its number are Unavailable. Hover a week for the numbers."
                   :"Bar height = Total Install; the orange top is Unavailable. Hover a day for the numbers.";
  return card(title,leg+`<div class="uchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${weekly?"Weekly":"Daily"} Install split into Unavailable and the rest, with New User">${g}</svg></div>`
    +`<p class="sub" style="margin:8px 0 0">${note}</p>`);
}
function uImpactHtml(D){

function uWhereHtml(D,U){

function renderUnav(block,srcDate){

  let body;
  if(!U){
    body=card("Not available for this report",'<p class="sub" style="margin:0">This report was built before Unavailable installs were split out. Pick a daily report for analysis day 2026-11-04 or later, or the weekly report for 11-08 – 11-14 or later.</p>');
  } else {
    const warn=(U.through&&U.through<U.period[1])?`<div class="warnbar">Unavailable data only runs through ${U.through}, so the latest day(s) are not split yet.</div>`:"";
    body=warn+uTilesHtml(D,U)+uTrendHtml(D,U)+uImpactHtml(D)+uWhereHtml(D,U)+uAboutHtml(D,U);
  }
  document.getElementById("body").innerHTML=head+'<div class="report">'+body+'</div>';
  const dp=document.getElementById("dp");
  if(dp){ const av=daily?analysisDayISO(D,srcDate):weekEndISO(D,srcDate); if(av) dp.value=av; }
  syncDatePicker(srcDate);
}

/* ---------- events ---------- */
document.getElementById("body").addEventListener("click",e=>{
  const g=e.target.closest("[data-goto]");
  if(g){ S.page=g.dataset.goto; try{localStorage.setItem("pf_page",S.page)}catch(x){}; refresh(); window.scrollTo(0,0); return; }
  const r=e.target.closest("tr[data-slice]");
  if(r){ const [a,c,o]=r.dataset.slice.split("|"); S.app=a; S.cty=c; if(o) S.os=o; refresh(); }
});
document.getElementById("nav").addEventListener("click",e=>{const a=e.target.closest("a[data-page]");if(!a)return;S.page=a.dataset.page;try{localStorage.setItem("pf_page",S.page)}catch(x){};refresh();});
document.getElementById("modeSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;S.mode=b.dataset.m;
  // Coming from a picked week whose run date has no daily report: show the daily report
  // for that week's last day (Sat) if present, else the nearest earlier daily, else latest.
  if(S.mode==="daily" && !(INDEX.daily_dates||[]).includes(S.date)){
    const w=weekOfRun(resolveWeekly(S.date)||""), want=w?toFileDay(w.end):S.date;
    S.date=(INDEX.daily_dates||[]).find(d=>d<=want)||INDEX.latest_daily||S.date;
  }
  refresh();});
document.getElementById("instSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;S.inst=b.dataset.i;refresh();});
document.getElementById("wkSel").addEventListener("change",e=>{if(e.target.value){S.date=e.target.value;refresh();}});
document.getElementById("appPill").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.app=b.dataset.a;refresh();});
document.getElementById("ctyPill").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.cty=b.dataset.c;refresh();});
document.getElementById("osPill").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;S.os=b.dataset.o;refresh();});
// The picker speaks analysis-day; map the picked analysis day back to the run/file date.
document.getElementById("dp").addEventListener("change",e=>{if(e.target.value){S.date=toFileDay(e.target.value);refresh();}});

(async()=>{
  try{
    INDEX=window.__HUB_INDEX||await (await fetch("./data/index.json",{cache:"no-store"})).json();
    if(!INDEX.dates||!INDEX.dates.length) throw new Error("No reports indexed.");
    // Hub builds: link the frozen quarterly archive artifacts (older history) in the side nav.
    const arch=(INDEX.archives||[]).map(a=>`<a href="${a.url}" target="_blank" rel="noopener">Archive ${a.label}</a>`);
    if(INDEX.archive) arch.unshift(`<a class="on">Archive ${INDEX.archive}</a>`);
    if(arch.length) document.getElementById("nav").insertAdjacentHTML("beforeend",arch.join(""));
    S.date=INDEX.latest_daily||INDEX.dates[0].date;
    S.mode="daily";
    const dp=document.getElementById("dp");
    // Bounds in analysis-day space (GA / Looker Studio style): the newest selectable day
    // is the latest analysis day = latest run date − lag, so readers can't pick a day
    // whose data doesn't exist yet. refresh() then pins the value to the true analysis day.
    dp.value=toAnalysisDay(S.date); dp.max=toAnalysisDay(INDEX.dates[0].date); dp.min=toAnalysisDay(INDEX.dates[INDEX.dates.length-1].date);
    document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.page===S.page));
    await refresh();
  }catch(e){
    document.getElementById("body").innerHTML='<div class="err"><b>Could not load data.</b><br>'+(e&&e.message||e)+
      '<br><br>Ensure <code>/docs/data/index.json</code> exists and GitHub Pages is enabled.</div>';
  }
})();
</script>
</body>
</html>
